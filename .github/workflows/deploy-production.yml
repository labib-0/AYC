name: Production VPS CI/CD Deployment

# ==============================================================================
# Ayaan Clothing — Full-Stack Continuous Integration & Validation Pipeline
# ==============================================================================
#
# Target Branches: main, backend-development
# Triggers:
#   - push to main, backend-development
#   - pull_request targeting main, backend-development
#   - workflow_dispatch for manual validation
#
# INVARIANTS:
#   1. Automatic production deployment on push or PR is permanently disabled.
#   2. Full frontend and backend validation test suites execute on every push and PR.
#   3. Isolated PostgreSQL 16 container service used for backend testing (never production).
#   4. Production deployment gate remains disabled; deployment job is strictly skipped.
#   5. Concurrency control cancels obsolete in-progress runs for the same branch.
# ==============================================================================

on:
  push:
    branches:
      - main
      - backend-development
  pull_request:
    branches:
      - main
      - backend-development
  workflow_dispatch:
    inputs:
      enable_deployment:
        description: 'Authorize real deployment to production VPS (requires ENABLE_PRODUCTION_DEPLOYMENT var)'
        required: true
        type: boolean
        default: false
      run_migrations:
        description: 'Authorize execution of pending database migrations (requires ENABLE_PRODUCTION_MIGRATIONS var)'
        required: true
        type: boolean
        default: false
      target_commit:
        description: 'Specific commit SHA to validate or deploy (defaults to current workflow event SHA)'
        required: false
        type: string
        default: ''

# Concurrency: Cancel superseded runs on the same branch or PR to avoid duplicate execution
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1: Frontend Validation & Test Suite ──────────────────────────────────
  validate-frontend:
    name: Frontend Validation & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Scan Repository for Leaked Keys or Credentials
        run: |
          echo "▶ Scanning repository for leaked keys or environment files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "✖ CRITICAL SECURITY VIOLATION: Forbidden credential files committed to Git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "✔ Workspace clean: zero credential files or private keys tracked in Git."

      - name: Validate Deployment Scripts & Permissions
        run: |
          echo "▶ Validating scripts/deploy-production.sh syntax & permissions..."
          test -f scripts/deploy-production.sh || (echo "✖ Missing scripts/deploy-production.sh" && exit 1)
          test -x scripts/deploy-production.sh || (echo "✖ scripts/deploy-production.sh is not marked executable" && exit 1)
          bash -n scripts/deploy-production.sh
          echo "✔ deploy-production.sh syntax and permissions verified."

          echo "▶ Validating scripts/migrate-to-shared-release.sh..."
          test -f scripts/migrate-to-shared-release.sh || (echo "✖ Missing scripts/migrate-to-shared-release.sh" && exit 1)
          bash -n scripts/migrate-to-shared-release.sh
          echo "✔ migrate-to-shared-release.sh syntax verified."

          echo "▶ Validating scripts/verify-deployment-release-gate.mjs..."
          test -f scripts/verify-deployment-release-gate.mjs || (echo "✖ Missing release gate script" && exit 1)
          node --check scripts/verify-deployment-release-gate.mjs
          echo "✔ verify-deployment-release-gate.mjs syntax verified."

      - name: Install Frontend Dependencies
        run: |
          echo "▶ Installing frontend dependencies using package-lock.json..."
          npm ci --no-audit --no-fund

      - name: TypeScript Typecheck Validation
        run: |
          echo "▶ Running TypeScript validation (npx tsc --noEmit)..."
          npx tsc --noEmit
          echo "✔ TypeScript compilation verified with zero type errors."

      - name: Product Serial & Position Sorting Tests
        run: |
          echo "▶ Running product serial number and position sorting tests..."
          npx tsx tests/product-serial-number-and-position-sorting.test.ts

      - name: Admin & Storefront Ordering Reconciliation Tests
        run: |
          echo "▶ Running admin/storefront ordering reconciliation tests..."
          npx tsx tests/admin-storefront-featured-ordering-reconciliation.test.ts

      - name: Storefront Featured Ordering Test Cases
        run: |
          echo "▶ Running storefront featured ordering verification cases..."
          npx tsx tests/storefront-featured-products-ordering-cases.test.ts

      - name: Drag-and-Drop Reorder Tests
        run: |
          echo "▶ Running existing drag-and-drop reorder tests..."
          npx tsx tests/admin-drag-drop-reorder.test.ts

      - name: Deployment Safety & Architecture Guard Tests
        run: |
          echo "▶ Running deployment pipeline safety test suite..."
          node --test tests/deploy-production-script.test.mjs

      - name: Next.js Production Build
        run: |
          echo "▶ Compiling Next.js production build (npm run build)..."
          npm run build
          echo "✔ Frontend production build compiled successfully."

  # ── Job 2: Backend Validation & Test Suite (PHP 8.4 & PostgreSQL 16) ─────────
  validate-backend:
    name: Backend Validation & Test Suite (PHP 8.4 & PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ayaan_testing
          POSTGRES_USER: ayaan_test_user
          POSTGRES_PASSWORD: ayaan_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup PHP 8.4 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, sqlite3, pdo_sqlite, redis, bcmath
          coverage: none
          tools: composer:v2

      - name: Validate Composer Configuration
        working-directory: backend
        run: |
          echo "▶ Running composer validate --strict on backend/composer.json..."
          composer validate --strict
          echo "✔ Backend composer.json is strictly valid."

      - name: Run PHP Syntax Checks
        run: |
          echo "▶ Running php -l syntax checks on application PHP files..."
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null; then
              echo "✖ PHP syntax error in $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find backend/app backend/config backend/routes backend/tests -name "*.php")

          if [ $ERRORS -ne 0 ]; then
            echo "✖ Total PHP syntax errors: $ERRORS"
            exit 1
          fi
          echo "✔ 100% of application PHP files passed PHP 8.4 syntax linting."

      - name: Verify Generated ReleaseIdentity.php Candidate Syntax
        run: |
          echo "▶ Testing candidate ReleaseIdentity.php template under PHP 8.4..."
          TMP_DIR=$(mktemp -d /tmp/rel-ident-XXXXXX)
          cat << 'PHP' > "${TMP_DIR}/ReleaseIdentity.php"
          <?php
          namespace App\Support;
          class ReleaseIdentity {
              public const COMMIT_SHA = '0123456789abcdef0123456789abcdef01234567';
              public const RELEASE_ID = 'release_20261030_120000_0123456';
              public const BUILD_ID = 'test_build_id_abc123';
              public const BUILT_AT = '2026-10-30T12:00:00Z';
              public static function commitSha(): ?string { return self::COMMIT_SHA; }
              public static function releaseId(): ?string { return self::RELEASE_ID; }
              public static function buildId(): ?string { return self::BUILD_ID; }
              public static function builtAt(): ?string { return self::BUILT_AT; }
          }
          PHP
          php -l "${TMP_DIR}/ReleaseIdentity.php"
          rm -rf "${TMP_DIR}"
          echo "✔ Candidate ReleaseIdentity template verified valid."

      - name: Install Backend Composer Dependencies
        working-directory: backend
        run: |
          echo "▶ Installing backend Composer dependencies (including require-dev)..."
          composer install --prefer-dist --no-interaction --no-progress
          echo "✔ Composer dependencies installed."

      - name: Configure Isolated Laravel Testing Environment
        working-directory: backend
        run: |
          echo "▶ Configuring isolated Laravel testing environment against PostgreSQL 16..."
          cat << 'ENV' > .env.testing
          APP_NAME="AYAAN CLOTHING"
          APP_ENV=testing
          APP_KEY=base64:6bW+k/7o4oK8H1gK5cM7dJ9F0xL3vN8qP2wR5tY7uI0=
          APP_DEBUG=true

          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=ayaan_testing
          DB_USERNAME=ayaan_test_user
          DB_PASSWORD=ayaan_test_password

          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          ENV

          php artisan key:generate --env=testing --no-interaction || true
          echo "▶ Running database migrations against isolated PostgreSQL 16 container..."
          php artisan migrate:fresh --env=testing --force --no-interaction
          echo "✔ Isolated database schema successfully migrated."

      - name: Run Product Position Sorting Backend Tests
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ayaan_testing
          DB_USERNAME: ayaan_test_user
          DB_PASSWORD: ayaan_test_password
        run: |
          echo "▶ Running ProductPositionSortingTest.php in isolated PostgreSQL environment..."
          ./vendor/bin/phpunit tests/Feature/Catalog/ProductPositionSortingTest.php

      - name: Run Storefront Featured Products Ordering Backend Tests
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ayaan_testing
          DB_USERNAME: ayaan_test_user
          DB_PASSWORD: ayaan_test_password
        run: |
          echo "▶ Running StorefrontFeaturedProductsOrderingTest.php in isolated PostgreSQL environment..."
          ./vendor/bin/phpunit tests/Feature/Catalog/StorefrontFeaturedProductsOrderingTest.php

      - name: Run Catalog & Pinned Products Backend Tests
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ayaan_testing
          DB_USERNAME: ayaan_test_user
          DB_PASSWORD: ayaan_test_password
        run: |
          echo "▶ Running PinnedProductsManagementTest and CatalogPersistentReorderingTest..."
          ./vendor/bin/phpunit tests/Feature/Catalog/PinnedProductsManagementTest.php tests/Feature/Catalog/CatalogPersistentReorderingTest.php

  # ── Job 3: Production VPS Deployment (STRICTLY DISABLED) ──────────────────────
  deploy-production:
    name: Production VPS Deployment (Gated & Disabled)
    needs: [validate-frontend, validate-backend]
    runs-on: ubuntu-latest
    environment: production
    # Strict Guard: Real deployment is disabled. Push and PR events can NEVER trigger deployment.
    # Manual dispatch requires explicit enable_deployment=true AND repository variable ENABLE_PRODUCTION_DEPLOYMENT='true' (currently disabled/false).
    if: >-
      (vars.ENABLE_PRODUCTION_DEPLOYMENT == 'true' || vars.ENABLE_PRODUCTION_DEPLOYMENT == true) &&
      github.event_name == 'workflow_dispatch' &&
      inputs.enable_deployment == true
    steps:
      - name: Deployment Inactive Guard
        run: |
          echo "========================================================================"
          echo "  DEPLOYMENT IS STRICTLY DISABLED IN THIS CI/CD WORKFLOW                "
          echo "========================================================================"
          echo "Safety invariant enforced: Automatic deployment on push or PR is permanently disabled."
          echo "No SSH credentials configured. No VPS connections attempted."
          echo "========================================================================"
          exit 0
