# ==============================================================================
# Ayaan Clothing — Authoritative Nginx Virtual Host Configuration
# Production: /etc/nginx/sites-available/ayaan-customer.conf
# ==============================================================================

server {
    server_name ayaanclothing.com www.ayaanclothing.com;

    # Baseline request body limit: 2MB for standard pages and JSON API requests
    client_max_body_size 2M;

    # Native connection limits (max 25 simultaneous TCP connections per IP)
    limit_conn conn_per_ip 25;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security: Deny sensitive files
    location ~ /\.env { deny all; return 404; }
    location ~ /\.git  { deny all; return 404; }
    location ~* ^/vendor/ { deny all; return 404; }

    # Laravel Public Storage (Customer: /storage/) - Unmetered static media
    location ^~ /storage/ {
        alias /var/www/ayaan/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Laravel Public Storage (Admin: /ayc/storage/) - Unmetered static media
    location ^~ /ayc/storage/ {
        alias /var/www/ayaan/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Laravel Sanctum CSRF Cookie
    location ^~ /sanctum {
        root /var/www/ayaan/backend/public;
        try_files $uri $uri/ @laravel;
    }

    # Customer API Backend (/api/)
    location /api {
        root /var/www/ayaan/backend/public;
        client_max_body_size 2M;
        limit_req zone=req_api_general burst=30 nodelay;

        # Dedicated: search suggestions
        location ^~ /api/v1/search/suggestions {
            client_max_body_size 2M;
            limit_req zone=req_api_search burst=10 nodelay;
            try_files $uri $uri/ @laravel;
        }

        # Dedicated: authentication & password reset
        location ~* ^/api/v1/auth/(login|register|password|admin/login) {
            client_max_body_size 2M;
            limit_req zone=req_api_auth burst=5 nodelay;
            try_files $uri $uri/ @laravel;
        }

        # Dedicated: PDF document generation
        location ~* ^/api/v1/orders/[^/]+/documents/[^/]+/pdf {
            client_max_body_size 2M;
            limit_req zone=req_api_heavy burst=5 nodelay;
            try_files $uri $uri/ @laravel;
        }

        # Dedicated: Order creation / checkout
        location = /api/v1/orders {
            client_max_body_size 2M;
            limit_req zone=req_api_heavy burst=5 nodelay;
            try_files $uri $uri/ @laravel;
        }

        # Dedicated: RFQ creation and tech-pack uploads (up to 20MB)
        location ~* ^/api/v1/rfq {
            client_max_body_size 20M;
            limit_req zone=req_api_upload burst=5 nodelay;
            try_files $uri $uri/ @laravel;
        }

        # Dedicated: Admin media upload (up to 20MB)
        location = /api/v1/upload {
            client_max_body_size 20M;
            limit_req zone=req_api_upload burst=5 nodelay;
            try_files $uri $uri/ @laravel;
        }

        # Dedicated: Payment proof upload (receipt images/PDFs up to 20MB)
        location ~* ^/api/v1/orders/[^/]+/payment-proof {
            client_max_body_size 20M;
            limit_req zone=req_api_upload burst=3 nodelay;
            try_files $uri $uri/ @laravel;
        }

        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/ayaan/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_INTERNAL_SECRET "";
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Admin API Backend (/ayc/api/...)
    location ^~ /ayc/api {
        client_max_body_size 2M;
        rewrite ^/ayc/api/(.*)$ /api/$1 break;
        root /var/www/ayaan/backend/public;
        limit_req zone=req_api_general burst=30 nodelay;

        # Dedicated: Admin media upload via /ayc/api namespace (up to 20MB)
        location ~* ^/ayc/api/(v1/)?upload {
            client_max_body_size 20M;
            limit_req zone=req_api_upload burst=5 nodelay;
            rewrite ^/ayc/api/(.*)$ /api/$1 break;
            try_files $uri $uri/ @laravel_ayc;
        }

        try_files $uri $uri/ @laravel_ayc;
    }

    location @laravel_ayc {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/ayaan/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_INTERNAL_SECRET "";
        include fastcgi_params;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_read_timeout 120s;
    }

    # Admin Portal Gateway (/ayc -> Port 3001)
    location ^~ /ayc {
        limit_req zone=req_storefront burst=50 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Admin-App "true";
        proxy_set_header X-Is-Admin-Host "1";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Retired legacy /admin namespace (Returns 404 Not Found)
    location ^~ /admin {
        return 404;
    }

    # Next.js Static Chunks & Build Artifacts (Port 3000) - Unmetered for browser performance
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js HMR or WebSocket
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Customer Storefront (Port 3000)
    location / {
        limit_req zone=req_storefront burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "keep-alive";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ayaanclothing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayaanclothing.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.ayaanclothing.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = ayaanclothing.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name ayaanclothing.com www.ayaanclothing.com;
    return 404;
}

# Internal Loopback Access Daemon (Port 8000)
# Strictly binds to 127.0.0.1 for server-to-server Next.js proxy checks.
server {
    listen 127.0.0.1:8000;
    server_name 127.0.0.1 localhost;

    root /var/www/ayaan/backend/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/ayaan/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }
}

